<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Temperature Converter</h1>
    <div class="celsius-to-fahrenheit-converter"> 
        <label for="celsius">Celsius:</label>
        <input type="number" id="celsius" name="celsius">
        <button onclick="convertToFahrenheit()">Convert to Fahrenheit</button>
        <p id="fahrenheit-result"></p>
    </div>

    <div class="fahrenheit-to-celsius-converter"> 
        <label for="fahrenheit">Fahrenheit:</label>
        <input type="number" id="fahrenheit" name="fahrenheit">
        <button onclick="convertToCelsius()">Convert to Celsius</button>
        <p id="celsius-result"></p>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
